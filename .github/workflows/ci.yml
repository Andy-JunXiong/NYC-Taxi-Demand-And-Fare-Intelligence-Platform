name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "pandas>=2,<3" "numpy>=1.24,<3" "duckdb>=1,<2" "matplotlib>=3.7,<4" "scikit-learn>=1.3,<2" "joblib>=1.3,<2" "pytest>=8,<9"
      - run: python -m pytest -q
